# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB
tone_instructions: "Be concise, direct and constructive. Flag real bugs, security gaps and edge cases first; skip nitpicks that tooling already catches."
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: true
  path_instructions:
    - path: "app/src/main/**/*.kt"
      instructions: |
        Android/Kotlin robot app. Check lifecycle and configuration-change handling, coroutine scoping,
        main-thread blocking, websocket/rosbridge reconnect and error handling, and that robot commands
        stop safely on disconnect.
    - path: "app/src/main/AndroidManifest.xml"
      instructions: |
        Check permissions are minimal, cleartext traffic and exported components are justified.
    - path: "**/*.gradle.kts"
      instructions: |
        Check dependency versions are pinned, and no signing secrets are committed.
    - path: "app/src/test/**"
      instructions: |
        Check tests are deterministic and cover failure paths.
    - path: ".github/workflows/**"
      instructions: |
        Check actions are pinned (ideally to a commit SHA), permissions follow least privilege,
        secrets are never echoed or exposed to untrusted PR code, and caching/matrix logic is correct.
    - path: "**/*.md"
      instructions: |
        Check docs stay accurate against the code (commands, paths, flags). Flag unverifiable claims.
